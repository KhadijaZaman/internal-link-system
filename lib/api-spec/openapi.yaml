openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Linkweave internal linking system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: sites
    description: Sites owned by the signed-in user
  - name: integrations
    description: Per-site data-source connections (GSC, GA4, Bing)
  - name: dashboard
    description: Dashboard summary data
  - name: graph
    description: Link graph data
  - name: inventory
    description: Page inventory
  - name: suggestions
    description: Link suggestions inbox
  - name: losers
    description: Query loser tracker
  - name: optimize
    description: URL optimizer queue
  - name: jobs
    description: Background job manual triggers
  - name: gsc
    description: Google Search Console analytics
  - name: ga4
    description: Google Analytics 4 page engagement
  - name: report
    description: Combined per-page GSC + GA4 performance report
  - name: gscChat
    description: Prompt-based GSC analysis
  - name: wp
    description: WordPress crawler classifications and exclude list
  - name: audits
    description: Weekly audit reports (orphans, over-linked, broken links)
  - name: linking
    description: Semantic linking engine settings
  - name: linkLookups
    description: On-demand internal link suggestions for arbitrary URLs / topics
  - name: content
    description: Content Writer & Auditor (SemanticsX-style) — research, write, audit
  - name: structural
    description: Structural quick wins — orphan and dead-end internal-link fixes
  - name: snapshot
    description: Site authority, health, and central-entity demand snapshot
  - name: kb
    description: Knowledge base documents used to ground optimization briefs
  - name: actions
    description: Prioritized action queue — one ranked "do this next" list
  - name: impact
    description: Before/after search impact of completed work, from GSC snapshots
  - name: digests
    description: Weekly digest — what happened, what got done, what improved
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current session
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Cross-tenant overview of all users and their sites (admin only)
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Not an admin
  /sites:
    post:
      operationId: createSite
      tags: [sites]
      summary: Add a new site owned by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteInput"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: Invalid domain or sitemap URL
        "401":
          description: Not signed in
        "409":
          description: Domain already registered or site limit reached
    get:
      operationId: listSites
      tags: [sites]
      summary: Sites owned by the signed-in user
      responses:
        "200":
          description: Owned sites plus whether the legacy site is claimable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitesResponse"
        "401":
          description: Not signed in
  /sites/claim-legacy:
    post:
      operationId: claimLegacySite
      tags: [sites]
      summary: Claim the legacy site with the previous admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimLegacyInput"
      responses:
        "200":
          description: Legacy site claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: Not signed in
        "403":
          description: Wrong password
        "409":
          description: Legacy site already claimed
        "429":
          description: Too many attempts — locked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimRateLimited"
  /site/limits:
    get:
      operationId: getSiteLimits
      tags: [sites]
      summary: Job spend limits for the active site
      responses:
        "200":
          description: Current per-run spend caps plus the allowed bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLimitsResponse"
        "401":
          description: Not signed in
        "403":
          description: Not the site owner
    patch:
      operationId: updateSiteLimits
      tags: [sites]
      summary: Update job spend limits for the active site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteLimitsInput"
      responses:
        "200":
          description: Updated limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLimitsResponse"
        "400":
          description: A limit is outside the allowed bounds
        "401":
          description: Not signed in
        "403":
          description: Not the site owner
  /site:
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Rename the active site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: Invalid display name
        "401":
          description: Not signed in
        "403":
          description: Not the site owner
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Permanently delete the active site and all of its data
      responses:
        "204":
          description: Site and all associated data deleted
        "401":
          description: Not signed in
        "403":
          description: Not the site owner
        "409":
          description: Deletion blocked (legacy site, or a job is currently running)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: Connection status for the active site's data sources
      responses:
        "200":
          description: Per-provider connection status (never includes credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsStatus"
        "401":
          description: Not signed in
  /integrations/gsc/auth-url:
    post:
      operationId: getGscAuthUrl
      tags: [integrations]
      summary: Start the Google Search Console OAuth flow for the active site
      responses:
        "200":
          description: Google consent URL to redirect the operator to
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
        "401":
          description: Not signed in
  /integrations/gsc/properties:
    get:
      operationId: listGscProperties
      tags: [integrations]
      summary: GSC properties available on the connected Google account
      responses:
        "200":
          description: Available properties and current selection
          content:
            application/json:
              schema:
                type: object
                required: [properties, selected]
                properties:
                  properties:
                    type: array
                    items: { type: string }
                  selected: { type: ["string", "null"] }
        "409":
          description: GSC not connected
  /integrations/gsc/property:
    post:
      operationId: setGscProperty
      tags: [integrations]
      summary: Select which GSC property feeds this site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGscPropertyInput"
      responses:
        "200":
          description: Property selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Property not in the connected account's list
        "409":
          description: GSC not connected
  /integrations/ga4:
    put:
      operationId: connectGa4
      tags: [integrations]
      summary: Save GA4 service-account credentials for the active site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectGa4Input"
      responses:
        "200":
          description: GA4 connected (credentials verified with a live call)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or unverifiable credentials
  /integrations/bing:
    put:
      operationId: connectBing
      tags: [integrations]
      summary: Save a Bing Webmaster API key for the active site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectBingInput"
      responses:
        "200":
          description: Bing connected (key verified with a live call)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or unverifiable API key
  /integrations/wp:
    put:
      operationId: connectWp
      tags: [integrations]
      summary: Save WordPress Application Password credentials for the active site (verified with a live wp/v2/users/me call)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectWpInput"
      responses:
        "200":
          description: WordPress connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or unverifiable credentials
  /cms/publish:
    post:
      operationId: publishToCms
      tags: [integrations]
      summary: Publish a post to the connected CMS (WordPress) as draft or live — straight from the app, no copy-paste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPublishInput"
      responses:
        "200":
          description: Post created in the CMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPublishResult"
        "400":
          description: CMS not connected or invalid input
  /backlinks/prospects:
    get:
      operationId: listBacklinkProspects
      tags: [backlinks]
      summary: List saved backlink prospects with outreach status
      responses:
        "200":
          description: Prospects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkProspectList"
    post:
      operationId: discoverBacklinkProspects
      tags: [backlinks]
      summary: Discover new prospects — domains that link to your competitors but not to you (DataForSEO, cached)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectDiscoveryInput"
      responses:
        "200":
          description: Updated prospect list after discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkProspectList"
        "400":
          description: Invalid competitor list
  /backlinks/audit:
    get:
      operationId: getBacklinkAudit
      tags: [backlinks]
      summary: Get the saved backlink audit (own profile + competitor benchmarks)
      responses:
        "200":
          description: Saved audit, or null when none has been run yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkAuditResponse"
    post:
      operationId: runBacklinkAudit
      tags: [backlinks]
      summary: Run or refresh the backlink audit via DataForSEO (paid; cached 24h)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunBacklinkAuditInput"
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkAuditResponse"
        "402":
          description: DataForSEO out of funds
  /backlinks/history:
    get:
      operationId: getBacklinkHistory
      tags: [backlinks]
      summary: Return the per-day history of domain rank, backlinks, referring domains, and dofollow count
      responses:
        "200":
          description: Ordered oldest-first history rows for the site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkHistoryResponse"
  /backlinks/disavow:
    get:
      operationId: getBacklinkDisavow
      tags: [backlinks]
      summary: Get persisted disavow decisions for the active site
      responses:
        "200":
          description: Current disavow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkDisavowList"
  /backlinks/disavow/export:
    get:
      operationId: exportDisavowTxt
      tags: [backlinks]
      summary: Download disavow.txt — Google-format file of all domains marked disavow
      responses:
        "200":
          description: Google-format disavow file (text/plain)
          content:
            text/plain:
              schema: { type: string }
  /backlinks/disavow/{domain}:
    put:
      operationId: setDisavowDecision
      tags: [backlinks]
      summary: Set or update the disavow decision for a domain
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisavowDecisionInput"
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkDisavowDecision"
        "400":
          description: Invalid domain or decision
    delete:
      operationId: clearDisavowDecision
      tags: [backlinks]
      summary: Clear (un-pin) the disavow decision for a domain
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Decision cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Decision not found
  /backlinks/prospects/{prospectId}:
    patch:
      operationId: updateBacklinkProspect
      tags: [backlinks]
      summary: Update outreach status or notes for a prospect
      parameters:
        - name: prospectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectUpdateInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkProspect"
        "404":
          description: Prospect not found
  /integrations/{provider}:
    delete:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Disconnect a data source from the active site
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [gsc, ga4, bing, wp] }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Unknown provider
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard KPIs and last-run timestamps
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/urls/{type}:
    get:
      operationId: getDashboardUrls
      tags: [dashboard]
      summary: URLs behind a dashboard KPI card
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [pages, links, orphans, dead-ends, pending-suggestions, critical-losers]
      responses:
        "200":
          description: List of URLs (capped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUrlList"
  /link-graph:
    get:
      operationId: getLinkGraph
      tags: [graph]
      summary: Force-directed graph data
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGraph"
  /link-graph/sheet-info:
    get:
      operationId: getLinkMapSheetInfo
      tags: [graph]
      summary: URL of the site's persistent Link Map Google Sheet, if one exists
      responses:
        "200":
          description: Stored link map sheet info (url is null when no sheet exists yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkMapSheetInfo"
  /link-graph/export-sheet:
    post:
      operationId: exportLinkMapSheet
      tags: [graph]
      summary: Export the site's link graph to a persistent Google Sheet — only the Link Map tab is written, all other tabs are preserved
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkMapSheetExportInput"
      responses:
        "200":
          description: Spreadsheet created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkMapSheetExportResult"
        "400":
          description: No link graph data found for this site
        "502":
          description: Google Sheets request failed
  /link-graph/focus:
    get:
      operationId: getLinkGraphFocus
      tags: [graph]
      summary: Focused subgraph for a single URL with scored neighbors and recommendations
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Focus payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGraphFocus"
        "404":
          description: URL not found
  /knowledge-graph:
    get:
      operationId: getKnowledgeGraph
      tags: [graph]
      summary: Topical knowledge graph — pages clustered by topic with link and semantic-similarity edges
      responses:
        "200":
          description: Knowledge graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"
  /inventory:
    get:
      operationId: getInventoryPage
      tags: [inventory]
      summary: Detail for a single inventory URL
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Page detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPageDetail"
        "404":
          description: Not found
  /suggestions:
    get:
      operationId: listSuggestions
      tags: [suggestions]
      summary: List link suggestions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_review, approved, rejected, inserted, all]
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkSuggestion"
  /suggestions/{id}/action:
    post:
      operationId: actSuggestion
      tags: [suggestions]
      summary: Approve, reject, or mark inserted
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionActionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSuggestion"
  /link-lookups:
    get:
      operationId: listLinkLookups
      tags: [linkLookups]
      summary: List recent on-demand link lookups
      responses:
        "200":
          description: Lookup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkLookup"
    post:
      operationId: createLinkLookups
      tags: [linkLookups]
      summary: Create one or more link-lookup jobs (URL, bulk URLs, or free text)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkLookupCreateInput"
      responses:
        "202":
          description: Lookups created (results processed asynchronously)
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items: { type: integer }
  /link-lookups/{id}:
    get:
      operationId: getLinkLookup
      tags: [linkLookups]
      summary: Get one link lookup with full results
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkLookup"
        "404":
          description: Not found
    delete:
      operationId: deleteLinkLookup
      tags: [linkLookups]
      summary: Delete a link lookup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /losers:
    get:
      operationId: listLosers
      tags: [losers]
      summary: Query losers grouped by severity for the latest week
      responses:
        "200":
          description: Loser groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoserWeek"
  /losers/query-insights:
    get:
      operationId: getQueryInsights
      tags: [losers]
      summary: GSC performance + AI strategy summary for a single search query
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          description: Query insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryInsights"
  /losers/{id}/send-to-optimizer:
    post:
      operationId: sendLoserToOptimizer
      tags: [losers]
      summary: Add loser's URL to the optimizer queue
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeQueueItem"
  /optimize-queue:
    get:
      operationId: listOptimizeQueue
      tags: [optimize]
      summary: List optimizer queue items
      responses:
        "200":
          description: Queue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptimizeQueueItem"
    post:
      operationId: addOptimizeQueueItem
      tags: [optimize]
      summary: Add a URL to the optimizer queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeQueueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeQueueItem"
  /optimize-queue/{id}/run:
    post:
      operationId: runOptimizeItem
      tags: [optimize]
      summary: Run the optimize brief generation for a single queue item immediately (background)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeQueueItem"
  /optimize-queue/{id}/requeue:
    post:
      operationId: requeueOptimizeItem
      tags: [optimize]
      summary: Set status back to optimize
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeQueueItem"
  /tracked-submissions:
    get:
      operationId: listTrackedSubmissions
      tags: [trackedSubmissions]
      summary: List custom tracked submissions
      responses:
        "200":
          description: Tracked submissions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackedSubmission"
    post:
      operationId: createTrackedSubmissions
      tags: [trackedSubmissions]
      summary: Add one or more URLs to the custom tracking list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedSubmissionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackedSubmission"
