          description: Cosine threshold (0-1) separating on-core from off-core query demand
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: Deterministic authority + central-entity snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoritySnapshot"
  /losers/weeks:
    get:
      operationId: getLoserWeeks
      tags: [losers]
      summary: Distinct weeks that have query-loser data, newest first
      responses:
        "200":
          description: Available loser weeks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoserWeekOption"
  /losers/pages:
    get:
      operationId: getLoserPages
      tags: [losers]
      summary: Query losers rolled up by page for a given week
      parameters:
        - name: weekOf
