      properties:
        id: { type: integer }
        url: { type: string }
        status: { type: string }
        priority: { type: string }
        notes: { type: ["string", "null"] }
        briefMarkdown: { type: ["string", "null"] }
        groundingPassages:
          type: ["array", "null"]
          description: Knowledge-base passages injected into the brief prompt. Null = brief predates grounding capture; empty = brief generated without KB grounding.
          items:
            $ref: "#/components/schemas/GroundingPassage"
        addedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
