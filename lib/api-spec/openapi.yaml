      type: object
      required: [documentId, documentTitle, chunkIndex, score, excerpt]
      properties:
        documentId: { type: integer }
        documentTitle: { type: string }
        chunkIndex: { type: integer }
        score: { type: number, description: Cosine similarity between the brief query and this chunk }
        excerpt: { type: string, description: First ~300 chars of the injected passage }
    OptimizeQueueInput:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }
        priority:
          type: string
          enum: [low, medium, high]
        notes: { type: string }
    TrackedSubmission:
      type: object
      required: [id, url, keyword, status, createdAt]
      properties:
        id: { type: integer }
        url: { type: string }
        keyword: { type: ["string", "null"] }
        label: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        exactImpressions28d:
          type: ["integer", "null"]
          description: >-
            US exact-query Google impressions over the trailing 28 days,
            captured during the keyword-movement sheet export. 0 with a
            recent checked-at = dead phrasing nobody searches. Null = never
            measured.
        exactImpressionsCheckedAt: { type: ["string", "null"], format: date-time }
    TrackedSubmissionCreate:
      type: object
      properties:
        urls:
          type: array
          items: { type: string, minLength: 1 }
        items:
          type: array
          items:
