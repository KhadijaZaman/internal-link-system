          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Weekly clicks/impressions/position series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactDetail"
  /digests:
    get:
      operationId: listDigests
      tags: [digests]
      summary: Past weekly digests, newest first
