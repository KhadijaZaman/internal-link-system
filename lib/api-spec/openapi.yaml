        - densityMaxPer1000
        - hubDensityMaxPer1000
        - moneyDensityMaxPer1000
        - shortPageMaxLinks
      properties:
        similarityThreshold: { type: number }
        densityMinPer1000: { type: number }
        densityMaxPer1000: { type: number }
        hubDensityMaxPer1000: { type: number }
        moneyDensityMaxPer1000: { type: number }
        shortPageMaxLinks: { type: integer }
        updatedAt: { type: ["string", "null"], format: date-time }
    LinkingSettingsInput:
      type: object
      properties:
        similarityThreshold: { type: number, minimum: 0, maximum: 1 }
        densityMinPer1000: { type: number, minimum: 0, maximum: 20 }
        densityMaxPer1000: { type: number, minimum: 0, maximum: 20 }
        hubDensityMaxPer1000: { type: number, minimum: 0, maximum: 20 }
        moneyDensityMaxPer1000: { type: number, minimum: 0, maximum: 20 }
        shortPageMaxLinks: { type: integer, minimum: 0, maximum: 20 }
    SuggestionActionInput:
