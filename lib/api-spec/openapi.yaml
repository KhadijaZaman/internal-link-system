        deltaPct:
          oneOf:
            - $ref: "#/components/schemas/GscDeltaPct"
            - type: "null"
        timeseries:
          type: array
          items: { $ref: "#/components/schemas/GscTimeseriesPoint" }
    GscQueryRow:
      type: object
