        bingClicks: { type: integer }
        bingImpressions: { type: integer }
        bingPosition: { type: ["number", "null"] }
        aiCitations: { type: integer }
        aiSessions: { type: integer }
        keyEvents: { type: integer }
        # One-line insight-specific context (e.g. "~120 clicks/mo missed" or the dropped query).
        detail: { type: ["string", "null"] }
    SeoInsight:
      type: object
      required: [id, severity, title, plainEnglish, action, affectedCount, topPages]
      properties:
        id:
          type: string
          enum: [low_ctr, bing_blind_spot, ai_visibility_gap, bing_upside, declining_queries]
        severity:
          type: string
          enum: [issue, opportunity, watch]
        title: { type: string }
        # Plain-English one-paragraph explanation of what this means for the site.
        plainEnglish: { type: string }
        # Recommended next step, phrased for a non-technical operator.
        action: { type: string }
        affectedCount: { type: integer }
        topPages:
          type: array
          items: { $ref: "#/components/schemas/SeoInsightPage" }
    SeoInsightsFreshness:
      type: object
      required: [gscSyncedAt, ga4SyncedAt, bingSyncedAt, aiCitationsAt, gscWindowStart, gscWindowEnd]
      properties:
        gscSyncedAt: { type: ["string", "null"], format: date-time }
        # The 7-day GSC window the stored click/impression rollups cover
        # (sync pulls days -9..-3 relative to the sync run, YYYY-MM-DD).
        gscWindowStart: { type: ["string", "null"], format: date }
        gscWindowEnd: { type: ["string", "null"], format: date }
        ga4SyncedAt: { type: ["string", "null"], format: date-time }
        bingSyncedAt: { type: ["string", "null"], format: date-time }
        aiCitationsAt: { type: ["string", "null"], format: date-time }
    SeoInsightsKpis:
      type: object
      required: [pages, gscClicks, gscImpressions, bingClicks, bingImpressions, aiCitations, aiSessions, keyEvents, missedClicks]
      properties:
        # Pages with visibility in at least one source (blocklist-filtered).
        pages: { type: integer }
        gscClicks: { type: integer }
        gscImpressions: { type: integer }
        bingClicks: { type: integer }
        bingImpressions: { type: integer }
        aiCitations: { type: integer }
        aiSessions: { type: integer }
        keyEvents: { type: integer }
        # Estimated clicks lost to below-benchmark CTR across flagged pages (GSC window).
        missedClicks: { type: integer }
    SeoInsightsResponse:
      type: object
      required: [freshness, kpis, insights]
      properties:
        freshness: { $ref: "#/components/schemas/SeoInsightsFreshness" }
        kpis: { $ref: "#/components/schemas/SeoInsightsKpis" }
        insights:
          type: array
          items: { $ref: "#/components/schemas/SeoInsight" }
    GenerateLinkMapInput:
      type: object
      required: [centralEntity, pageUrls]
      properties:
        # The single entity the cluster is about.
        centralEntity: { type: string, minLength: 2, maxLength: 200 }
        # Optional pillar/category page; must be one of pageUrls when set.
        hubUrl: { type: ["string", "null"] }
        pageUrls:
          type: array
          minItems: 2
          maxItems: 30
          items: { type: string }
        maxNewLinksPerPage: { type: integer, minimum: 1, maximum: 10, default: 4 }
    LinkMapProposal:
      type: object
      required: [from, to, anchorText, placement, bridgeSentence, rules, why]
      properties:
        from: { type: string }
        to: { type: string }
        anchorText: { type: string }
        placement: { type: string }
        bridgeSentence: { type: string }
        rules:
          type: array
          items: { type: string }
        why: { type: string }
    LinkMapFlag:
      type: object
      required: [type, page, detail]
      properties:
        type: { type: string }
        page: { type: string }
        detail: { type: string }
    LinkMapDoNotLink:
      type: object
      required: [from, to, reason]
      properties:
        from: { type: string }
        to: { type: string }
        reason: { type: string }
    LinkMapCoverageRow:
      type: object
      required: [url, h1, layer, inboundSiteWide, outIntoCluster, inFromCluster]
      properties:
        url: { type: string }
        h1: { type: ["string", "null"] }
        layer: { type: string }
        inboundSiteWide: { type: integer }
        outIntoCluster: { type: integer }
        inFromCluster: { type: integer }
    LinkMapGenerationResponse:
      type: object
      required:
        [
          available,
          runId,
          status,
          error,
          centralEntity,
          hubUrl,
          pageUrls,
          maxNewLinksPerPage,
          startedAt,
          finishedAt,
          coverage,
          proposals,
          flags,
          doNotLink,
        ]
      properties:
        available: { type: boolean }
        runId: { type: ["integer", "null"] }
        status: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        centralEntity: { type: ["string", "null"] }
        hubUrl: { type: ["string", "null"] }
        pageUrls:
          type: array
          items: { type: string }
        maxNewLinksPerPage: { type: ["integer", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        # Deterministic per-page cluster coverage computed from the crawl DB (not the AI).
        coverage:
          type: array
          items: { $ref: "#/components/schemas/LinkMapCoverageRow" }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/LinkMapProposal" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/LinkMapFlag" }
        doNotLink:
          type: array
          items: { $ref: "#/components/schemas/LinkMapDoNotLink" }
    ResearchDetailRow:
      type: object
      required: [label, value, extra]
      properties:
        label: { type: string }
        value: { type: number }
        extra: { type: ["string", "null"] }
    ResearchFinding:
      type: object
      required: [slug, title, headlineStat, citation, methodology, detail]
      properties:
        slug: { type: string }
        title: { type: string }
        # The headline number, formatted (e.g. "38.2%").
        headlineStat: { type: string }
        # One citation-ready sentence including the stat and sample size.
        citation: { type: string }
        # How the number was computed — dataset, window, filters.
        methodology: { type: string }
        detail:
          type: array
          items: { $ref: "#/components/schemas/ResearchDetailRow" }
    ResearchRunResponse:
      type: object
      required: [available, runId, status, windowStart, windowEnd, finishedAt, findings]
      properties:
        available: { type: boolean }
        runId: { type: ["integer", "null"] }
        status: { type: ["string", "null"] }
        windowStart: { type: ["string", "null"] }
        windowEnd: { type: ["string", "null"] }
        finishedAt: { type: ["string", "null"], format: date-time }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ResearchFinding" }
    SeoReportWindow:
      type: object
      required: [start, end]
      properties:
        start: { type: ["string", "null"] }
        end: { type: ["string", "null"] }
    # --- Section 1: query integrity (cannibalization & mismapping) ---
    SeoReportQueryIntegrityUrl:
      type: object
      required: [path, impressions, sharePct, position]
      properties:
        path: { type: string }
        impressions: { type: integer }
        # Share of THIS query's impressions across the returned URLs only —
        # NOT a share of all site queries (GSC anonymizes low-volume queries).
        sharePct: { type: number }
        position: { type: number }
    SeoReportQueryIntegrityRow:
      type: object
      required: [query, impressions, clicks, urls]
      properties:
        query: { type: string }
        impressions: { type: integer }
        clicks: { type: integer }
        urls:
          type: array
          items: { $ref: "#/components/schemas/SeoReportQueryIntegrityUrl" }
    SeoReportQueryIntegrity:
      type: object
      required: [available, note, rows, totalCount]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        totalCount: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/SeoReportQueryIntegrityRow" }
    # --- Section 2: CTR vs expected curve ---
    SeoReportCtrCurveRow:
      type: object
      required: [path, impressions, clicks, position, actualCtr, expectedCtr, ratio, missedClicks]
      properties:
        path: { type: string }
        impressions: { type: integer }
        clicks: { type: integer }
        position: { type: number }
        actualCtr: { type: number }
        expectedCtr: { type: number }
        ratio: { type: number }
        # Clicks lost vs the position benchmark (expectedCtr*impressions - clicks).
        missedClicks: { type: integer }
    SeoReportCtrCurve:
      type: object
      required: [available, note, belowCurve, aboveCurve]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        belowCurve:
          type: array
          items: { $ref: "#/components/schemas/SeoReportCtrCurveRow" }
        aboveCurve:
          type: array
          items: { $ref: "#/components/schemas/SeoReportCtrCurveRow" }
    # --- Section 3: striking distance (near-miss) ---
    SeoReportStrikingDistanceQuery:
      type: object
      required: [query, position, impressions, clicks, score, page2, bestPath]
      properties:
        query: { type: string }
        position: { type: number }
        impressions: { type: integer }
        clicks: { type: integer }
        # position × volume ranking score (impressions × closeness to page 1).
        score: { type: number }
        # True when the query sits on page 2 (position > 10).
        page2: { type: boolean }
        bestPath: { type: ["string", "null"] }
    SeoReportStrikingDistance:
      type: object
      required: [available, note, windowStart, windowEnd, totalCandidates, queries]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        windowStart: { type: ["string", "null"] }
        windowEnd: { type: ["string", "null"] }
        totalCandidates: { type: integer }
        queries:
          type: array
          items: { $ref: "#/components/schemas/SeoReportStrikingDistanceQuery" }
    # --- Section 4: query discovery (coverage expansion per URL) ---
    SeoReportQueryDiscoveryRow:
      type: object
      required: [path, queriesNow, queriesBefore, delta]
      properties:
        path: { type: string }
        queriesNow: { type: integer }
        queriesBefore: { type: integer }
        delta: { type: integer }
    SeoReportQueryDiscovery:
      type: object
      required: [available, note, dateNow, dateBefore, gainers, losers]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        dateNow: { type: ["string", "null"] }
        dateBefore: { type: ["string", "null"] }
        gainers:
          type: array
          items: { $ref: "#/components/schemas/SeoReportQueryDiscoveryRow" }
        losers:
          type: array
          items: { $ref: "#/components/schemas/SeoReportQueryDiscoveryRow" }
    # --- Section 5: indexing by template (structural coverage proxy) ---
    SeoReportIndexingTemplateRow:
      type: object
      required: [section, totalPages, pagesWithImpressions, zeroImpressionPct]
      properties:
        section: { type: ["string", "null"] }
        totalPages: { type: integer }
        pagesWithImpressions: { type: integer }
        zeroImpressionPct: { type: number }
    SeoReportIndexingByTemplate:
      type: object
      required: [available, note, sections]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SeoReportIndexingTemplateRow" }
    # --- Section 6: invest map (where to invest) ---
    SeoReportInvestRow:
      type: object
      required: [path, title, section, clicks, impressions, position, sessions, engagementRate, keyEvents, topQuery]
      properties:
        path: { type: string }
        title: { type: ["string", "null"] }
        section: { type: ["string", "null"] }
        clicks: { type: integer }
        impressions: { type: integer }
        position: { type: ["number", "null"] }
        sessions: { type: integer }
        engagementRate: { type: ["number", "null"] }
        keyEvents: { type: integer }
        topQuery: { type: ["string", "null"] }
    SeoReportInvestMap:
      type: object
      required: [available, note, pages]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/SeoReportInvestRow" }
    # --- Section 7: title rewrites ---
    SeoReportTitleRewriteRow:
      type: object
      required: [path, title, impressions, clicks, position, actualCtr, expectedCtr, missedClicks, keyEvents]
      properties:
        path: { type: string }
        title: { type: ["string", "null"] }
        impressions: { type: integer }
        clicks: { type: integer }
        position: { type: number }
        actualCtr: { type: number }
        expectedCtr: { type: number }
        missedClicks: { type: integer }
        keyEvents: { type: integer }
    SeoReportTitleRewrites:
      type: object
      required: [available, note, pages]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/SeoReportTitleRewriteRow" }
    # --- Section 8: wrong intent ---
    SeoReportWrongIntentRow:
      type: object
      required: [path, title, topQuery, clicks, engagementRate, avgEngagementTime, keyEvents]
      properties:
        path: { type: string }
        title: { type: ["string", "null"] }
        topQuery: { type: ["string", "null"] }
        clicks: { type: integer }
        engagementRate: { type: ["number", "null"] }
        avgEngagementTime: { type: ["number", "null"] }
        keyEvents: { type: integer }
    SeoReportWrongIntent:
      type: object
      required: [available, note, pages]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/SeoReportWrongIntentRow" }
    # --- Section 9: Bing-only queries ---
    SeoReportBingOnlyRow:
      type: object
      required: [query, impressions, clicks, position]
      properties:
        query: { type: string }
        impressions: { type: integer }
        clicks: { type: integer }
        position: { type: ["number", "null"] }
    SeoReportBingOnlyQueries:
      type: object
      required: [available, note, queries]
      properties:
        available: { type: boolean }
        note: { type: ["string", "null"] }
        queries:
          type: array
          items: { $ref: "#/components/schemas/SeoReportBingOnlyRow" }
    SeoReportResponse:
      type: object
      required:
        [
          window,
          generatedAt,
          queryIntegrity,
          ctrCurve,
          strikingDistance,
          queryDiscovery,
          indexingByTemplate,
          investMap,
          titleRewrites,
          wrongIntent,
          bingOnlyQueries,
        ]
      properties:
        window: { $ref: "#/components/schemas/SeoReportWindow" }
        generatedAt: { type: string, format: date-time }
        queryIntegrity: { $ref: "#/components/schemas/SeoReportQueryIntegrity" }
        ctrCurve: { $ref: "#/components/schemas/SeoReportCtrCurve" }
        strikingDistance: { $ref: "#/components/schemas/SeoReportStrikingDistance" }
        queryDiscovery: { $ref: "#/components/schemas/SeoReportQueryDiscovery" }
        indexingByTemplate: { $ref: "#/components/schemas/SeoReportIndexingByTemplate" }
        investMap: { $ref: "#/components/schemas/SeoReportInvestMap" }
        titleRewrites: { $ref: "#/components/schemas/SeoReportTitleRewrites" }
        wrongIntent: { $ref: "#/components/schemas/SeoReportWrongIntent" }
        bingOnlyQueries: { $ref: "#/components/schemas/SeoReportBingOnlyQueries" }
    GscDimensionRow:
      type: object
      required: [key, clicks, impressions, ctr, position]
      properties:
        key: { type: string }
        clicks: { type: integer }
        impressions: { type: integer }
        ctr: { type: number }
        position: { type: number }
    GscGeoResponse:
      type: object
      required: [countries, devices]
      properties:
        countries:
          type: array
          items: { $ref: "#/components/schemas/GscDimensionRow" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/GscDimensionRow" }
    GscSitemap:
      type: object
      required: [path]
      properties:
        path: { type: string }
        lastSubmitted: { type: ["string", "null"], format: date-time }
        lastDownloaded: { type: ["string", "null"], format: date-time }
        warnings: { type: ["integer", "null"] }
        errors: { type: ["integer", "null"] }
        isPending: { type: ["boolean", "null"] }
        contents:
          type: array
          items:
            type: object
            required: [type, submitted, indexed]
            properties:
              type: { type: string }
              submitted: { type: integer }
              indexed: { type: integer }
    GscIndexingResponse:
      type: object
      required: [sitemaps, lastChecked, notIndexedCandidates]
      properties:
        sitemaps:
          type: array
          items: { $ref: "#/components/schemas/GscSitemap" }
        lastChecked: { type: string, format: date-time }
        notice: { type: ["string", "null"] }
        notIndexedCandidates:
          type: array
          description: URLs known to our crawl inventory that recorded 0 GSC impressions in the last 90 days. Candidates for URL Inspection.
          items:
            type: object
            required: [url, reason]
            properties:
              url: { type: string }
              reason: { type: string, description: "Heuristic reason — e.g. no-impressions-90d" }
              lastSeenInGsc: { type: ["string", "null"], format: date }
        candidatesWindowStart: { type: ["string", "null"], format: date }
        candidatesWindowEnd: { type: ["string", "null"], format: date }
        autoInspectedSample:
          type: array
          description: Server-side URL Inspection of the first few candidates (cached 24h) so true GSC reasons appear without user action.
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              verdict: { type: ["string", "null"] }
              coverageState: { type: ["string", "null"] }
              indexingState: { type: ["string", "null"] }
              robotsTxtState: { type: ["string", "null"] }
        autoInspectedReasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer }
    GscInspectionResult:
      type: object
      required: [url, fetchedAt]
      properties:
        url: { type: string }
        fetchedAt: { type: string, format: date-time }
        verdict: { type: ["string", "null"] }
        coverageState: { type: ["string", "null"] }
        robotsTxtState: { type: ["string", "null"] }
        indexingState: { type: ["string", "null"] }
        lastCrawlTime: { type: ["string", "null"], format: date-time }
        googleCanonical: { type: ["string", "null"] }
        userCanonical: { type: ["string", "null"] }
        pageFetchState: { type: ["string", "null"] }
        mobileUsability: { type: ["string", "null"] }
        raw: { type: ["object", "null"], additionalProperties: true }
    GscCwvMetric:
      type: object
      required: [metric, p75, band, distribution]
      properties:
        metric: { type: string }
        p75: { type: number }
        band: { type: string, enum: [good, ni, poor, unknown] }
        distribution:
          type: array
          items:
            type: object
            required: [label, density]
            properties:
              label: { type: string }
              density: { type: number }
    GscCwvFormFactor:
      type: object
      required: [formFactor, metrics]
      properties:
        formFactor: { type: string, enum: [PHONE, DESKTOP, ALL_FORM_FACTORS] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/GscCwvMetric" }
    GscCwvResponse:
      type: object
      required: [scope, fetchedAt]
      properties:
        scope: { type: string }
        fetchedAt: { type: string, format: date-time }
        formFactors:
          type: array
          items: { $ref: "#/components/schemas/GscCwvFormFactor" }
        notice: { type: ["string", "null"] }
    GscLinkRow:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    GscLinksResponse:
      type: object
      required: [topInternalTargets, topLinkingDomains, topExternalLinkingDomains]
      properties:
        topInternalTargets:
          type: array
          items: { $ref: "#/components/schemas/GscLinkRow" }
        topLinkingDomains:
          type: array
          items: { $ref: "#/components/schemas/GscLinkRow" }
        topExternalLinkingDomains:
          type: array
          description: External referring domains pulled from DataForSEO Backlinks API.
          items:
            type: object
            required: [domain, backlinks]
            properties:
              domain: { type: string }
              backlinks: { type: integer }
              rank: { type: ["integer", "null"] }
              firstSeen: { type: ["string", "null"] }
              lastSeen: { type: ["string", "null"] }
        externalNotice: { type: ["string", "null"] }
        notice: { type: ["string", "null"] }
    GscBatchInspectionRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          maxItems: 10
          items: { type: string }
    GscBatchInspectionResponse:
      type: object
      required: [inspected, results, reasons]
      properties:
        inspected: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              verdict: { type: ["string", "null"] }
              coverageState: { type: ["string", "null"] }
              indexingState: { type: ["string", "null"] }
              robotsTxtState: { type: ["string", "null"] }
              error: { type: ["string", "null"] }
        reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer }
    GscUrlDrilldown:
      type: object
      required: [url, queries, timeseries]
      properties:
        url: { type: string }
        queries:
          type: array
          items: { $ref: "#/components/schemas/GscQueryRow" }
        timeseries:
          type: array
          items: { $ref: "#/components/schemas/GscTimeseriesPoint" }
    GscChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    GscChatRequest:
      type: object
      required: [startDate, endDate]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/GscChatMessage" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        url: { type: ["string", "null"] }
        includeDefault: { type: boolean }
    GscChatResponse:
      type: object
      required: [reply, contextSummary]
      properties:
        reply: { type: string }
        contextSummary: { type: string }
    WpClassification:
      type: object
      required: [url]
      properties:
        url: { type: string }
        tier: { type: ["integer", "null"] }
        centralEntity: { type: ["string", "null"] }
        subEntity: { type: ["string", "null"] }
        parentRootUrl: { type: ["string", "null"] }
        canonicalQuery: { type: ["string", "null"] }
        anchorVariants:
          type: array
          items: { type: string }
        linkQuotaMin: { type: ["integer", "null"] }
        linkQuotaMax: { type: ["integer", "null"] }
        topicalBordersMatch: { type: ["boolean", "null"] }
        manuallyEdited: { type: ["boolean", "null"] }
        classifiedAt: { type: ["string", "null"], format: date-time }
        title: { type: ["string", "null"] }
        wordCount: { type: ["integer", "null"] }
    WpClassificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WpClassification" }
    WpClassificationPatch:
      type: object
      required: [url]
      properties:
        url: { type: string }
        tier: { type: ["integer", "null"], minimum: 1, maximum: 4 }
        centralEntity: { type: ["string", "null"] }
        subEntity: { type: ["string", "null"] }
        parentRootUrl: { type: ["string", "null"] }
        canonicalQuery: { type: ["string", "null"] }
        anchorVariants:
          type: array
          items: { type: string }
        topicalBordersMatch: { type: ["boolean", "null"] }
    WpExcludeItem:
      type: object
      required: [id, pattern]
      properties:
        id: { type: integer }
        pattern: { type: string }
