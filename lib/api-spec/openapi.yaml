              url: { type: string, minLength: 1 }
              keyword: { type: string }
        keyword: { type: string }
        note: { type: string }
    TrackedSubmissionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [tracking, done]
        keyword: { type: ["string", "null"] }
    SubmissionsSheetExportInput:
      type: object
