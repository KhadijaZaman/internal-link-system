      properties:
        id: { type: integer }
        title: { type: string }
        charCount: { type: integer }
        chunkCount: { type: integer }
        embedStatus:
          type: string
          enum: [pending, ready, partial]
          description: Embedding lifecycle — pending = queued for background embedding, ready = all chunks embedded, partial = some chunks failed (retried on next embed run)
        embeddedChunkCount: { type: integer }
        createdAt: { type: ["string", "null"] }
    KbDocumentInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        content: { type: string, minLength: 1, maxLength: 500000 }
    StartClusterRunInput:
      type: object
      required: [paidRunConfirmed]
      properties:
        weeks:
          type: integer
          minimum: 4
          maximum: 52
          description: GSC lookback window in weeks (4–52); each period spans exactly weeks*7 days. Wins over days when both supplied. Defaults to 12 when neither weeks nor days is provided.
        days:
          type: integer
          minimum: 7
          maximum: 180
          description: "Legacy: GSC lookback window in days. Converted to nearest weeks when weeks is absent. Ignored when weeks is explicitly supplied."
        country:
          type: ["string", "null"]
          pattern: "^[A-Za-z]{3}$"
          description: ISO 3166-1 alpha-3 GSC country filter; omit for worldwide
        keywordLimit: { type: integer, minimum: 10, maximum: 1000, default: 250 }
        locationCode:
          type: integer
          default: 2840
          description: DataForSEO SERP location_code (2840 = United States)
        excludeBrand: { type: boolean, default: true }
        paidRunConfirmed:
          type: boolean
          const: true
          description: Explicit owner approval of the paid SERP scrape shown in the confirmation step.
    ClusterRunWindow:
      type: object
      required: [currentStart, currentEnd, priorStart, priorEnd]
      description: Exact ISO date ranges used for current and prior GSC periods
      properties:
        currentStart: { type: string, description: "Start of current period (YYYY-MM-DD)" }
        currentEnd: { type: string, description: "End of current period (YYYY-MM-DD, UTC today minus 3 days)" }
        priorStart: { type: string, description: "Start of prior period (YYYY-MM-DD)" }
        priorEnd: { type: string, description: "End of prior period (YYYY-MM-DD, day before currentStart)" }
    ClusterRunParams:
      type: object
      required: [country, keywordLimit, locationCode, excludeBrand]
      properties:
        weeks:
          type: integer
          description: GSC lookback window in weeks (4–52, default 12)
        days:
          type: integer
          description: "Legacy lookback in days (kept for backward compat; prefer weeks)"
        country: { type: ["string", "null"] }
        keywordLimit: { type: integer }
        locationCode: { type: integer }
        excludeBrand: { type: boolean }
        reprocess:
          type: boolean
          description: Set while a rebuild-from-stored-SERPs is queued/running
        window:
          $ref: "#/components/schemas/ClusterRunWindow"
    ClusterRun:
      type: object
      required: [id, status, phase, params, progressDone, progressTotal, stats, error, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [queued, running, complete, failed, interrupted]
        phase: { type: ["string", "null"] }
        params:
          $ref: "#/components/schemas/ClusterRunParams"
        progressDone: { type: integer }
        progressTotal: { type: integer }
        stats:
          type: object
          additionalProperties: { type: number }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
        startedAt: { type: ["string", "null"] }
        finishedAt: { type: ["string", "null"] }
    ClusterSerpUrl:
      type: object
      required: [url, position]
      properties:
        url: { type: string }
        position: { type: number }
    KeywordState:
      type: string
      enum: [new, rising, displaced, zero_click, striking_distance, stable]
      description: |
        Performance state of a keyword comparing current vs prior period.
        new: no prior impressions. rising: impressions up >30%.
        displaced: clicks down >30% while impressions stable (≤10% change).
        zero_click: enough impressions but CTR<0.005.
        striking_distance: enough impressions and position 5–15.
        stable: none of the above apply.
    ClusterKeyword:
      type: object
      required: [query, clicks, impressions, ctr, position, serpUrls]
      properties:
        query: { type: string }
        clicks: { type: integer }
        impressions: { type: integer }
        ctr: { type: number }
        position: { type: number }
        serpUrls:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSerpUrl"
        priorClicks: { type: ["integer", "null"], description: Prior-period clicks }
        priorImpressions: { type: ["integer", "null"], description: Prior-period impressions }
        priorCtr: { type: ["number", "null"], description: Prior-period CTR (0–1) }
        priorPosition: { type: ["number", "null"], description: Prior-period impression-weighted average position }
        clickDelta:
          type: ["number", "null"]
          description: "(current-prior)/prior for clicks; null when prior impressions=0 or no prior data"
        impressionDelta:
          type: ["number", "null"]
          description: "(current-prior)/prior for impressions; null when prior impressions=0 or no prior data"
        clickDeltaAbs: { type: ["integer", "null"], description: Absolute change in clicks (current − prior) }
        impressionDeltaAbs: { type: ["integer", "null"], description: Absolute change in impressions (current − prior) }
        state:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/KeywordState"
          description: Keyword performance state classification
    ClusterUrl:
      type: object
      required: [url, domain, keywordCount, bestPosition, avgPosition]
      properties:
        url: { type: string }
        domain: { type: string }
        keywordCount: { type: integer }
        bestPosition: { type: ["number", "null"] }
        avgPosition: { type: ["number", "null"] }
    ClusterStateCounts:
      type: object
      description: Count of keywords in each state for a cluster
      required: [new, rising, displaced, zero_click, striking_distance, stable]
      properties:
        new: { type: integer }
        rising: { type: integer }
        displaced: { type: integer }
        zero_click: { type: integer }
        striking_distance: { type: integer }
        stable: { type: integer }
    KeywordCluster:
      type: object
      required: [id, clusterKey, topic, quadrant, isOutlier, keywordCount, totalClicks, totalImpressions, blendedCtr, avgPosition, coreSimilarity, coreTag, keywords, ownUrls, competitorUrls]
      properties:
        id: { type: integer }
        clusterKey:
          type: integer
          description: Sequential cluster number; -1 = unclustered keywords
        topic: { type: string }
        quadrant:
          type: ["string", "null"]
          enum: [opportunities, stars, niche, underperformers, null]
        isOutlier: { type: boolean }
        keywordCount: { type: integer }
        totalClicks: { type: integer }
        totalImpressions: { type: integer }
        blendedCtr: { type: number, description: Blended CTR as a percentage }
        avgPosition: { type: ["number", "null"] }
        coreSimilarity:
          type: ["number", "null"]
          description: Cosine similarity between the cluster's impression-weighted keyword centroid and the site's core-topic centroid (null = not enough embedded keywords)
        coreTag:
          type: ["string", "null"]
          enum: [on_core, off_core, null]
          description: Whether this cluster's search demand aligns with the site's core topic (threshold 0.42)
        priorTotalClicks:
          type: ["integer", "null"]
          description: Prior-period total clicks for this cluster (null for old runs without prior data)
        priorTotalImpressions:
          type: ["integer", "null"]
          description: Prior-period total impressions for this cluster
        priorBlendedCtr:
          type: ["number", "null"]
          description: Prior-period blended CTR as a percentage
        priorAvgPosition:
          type: ["number", "null"]
          description: Prior-period impression-weighted average position
        clickDeltaAbs:
          type: ["integer", "null"]
          description: Absolute change in cluster clicks (current − prior)
        impressionDeltaAbs:
          type: ["integer", "null"]
          description: Absolute change in cluster impressions (current − prior)
        clickDeltaRatio:
          type: ["number", "null"]
          description: "(currentClicks − priorClicks) / priorClicks; null when prior=0 or no prior"
        impressionDeltaRatio:
          type: ["number", "null"]
          description: "(currentImpressions − priorImpressions) / priorImpressions; null when prior=0 or no prior"
        stateCounts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClusterStateCounts"
          description: Count of keywords per state; null for old runs without state data
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/ClusterKeyword"
        ownUrls:
          type: array
          items:
            $ref: "#/components/schemas/ClusterUrl"
        competitorUrls:
          type: array
          items:
            $ref: "#/components/schemas/ClusterUrl"
    StartSimilarityRunInput:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 2
          maxItems: 100
          items: { type: string }
          description: Article URLs to analyze (http/https, deduped server-side)
    SimilarityMatch:
      type: object
      required: [url, title, sim]
      properties:
        url: { type: string }
        title: { type: ["string", "null"] }
        sim: { type: number, description: Cosine similarity (0-1) }
    SimilarityArticle:
      type: object
      required: [url, finalUrl, title, wordCount, topics, mainTheme, error, similar]
      properties:
        url: { type: string }
        finalUrl: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        wordCount: { type: ["integer", "null"] }
        topics:
          type: array
          items: { type: string }
        mainTheme: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        similar:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityMatch"
    SimilarityCluster:
      type: object
      required: [label, memberUrls]
      properties:
        label: { type: string }
        memberUrls:
          type: array
          items: { type: string }
    SimilarityResults:
      type: object
      required: [articles, clusters]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityArticle"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityCluster"
    SimilarityRun:
      type: object
      required: [id, status, urls, progressDone, progressTotal, results, error, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [queued, running, complete, failed, interrupted]
        urls:
          type: array
          items: { type: string }
        progressDone: { type: integer }
        progressTotal: { type: integer }
        results:
          oneOf:
            - $ref: "#/components/schemas/SimilarityResults"
            - type: "null"
        error: { type: ["string", "null"] }
        createdAt: { type: string }
        startedAt: { type: ["string", "null"] }
        finishedAt: { type: ["string", "null"] }
    AiCitationUploadInput:
      type: object
      required: [content]
      properties:
        label:
          type: string
          maxLength: 200
          description: Optional label (defaults to a timestamped name)
        content:
          type: string
          minLength: 1
          maxLength: 1500000
          description: Raw CSV text of the Bing AI Performance export
    AiCitationUpload:
      type: object
      required: [id, label, kind, rowCount, unmatchedCount, uploadedAt]
      properties:
        id: { type: integer }
        label: { type: string }
        kind:
          type: string
          enum: [pages, grounding_queries]
        rowCount: { type: integer }
        unmatchedCount: { type: integer }
        uploadedAt: { type: string }
    AiCitationUploadResult:
      type: object
      required: [upload, matchedPages, totalCitations, warnings]
      properties:
        upload:
          $ref: "#/components/schemas/AiCitationUpload"
        matchedPages:
          type: integer
          description: Rows whose URL mapped onto the canonical page registry (pages kind)
        totalCitations: { type: integer }
        warnings:
          type: array
          items: { type: string }
    BingPageMapRow:
      type: object
      required: [path, title, section, gscClicks, gscImpressions, gscPosition, bingClicks, bingImpressions, bingPosition, aiCitations, aiSessions]
      properties:
        path: { type: string }
        title: { type: ["string", "null"] }
        section: { type: ["string", "null"] }
        gscClicks: { type: ["integer", "null"] }
        gscImpressions: { type: ["integer", "null"] }
        gscPosition: { type: ["number", "null"] }
        bingClicks: { type: ["integer", "null"] }
        bingImpressions: { type: ["integer", "null"] }
        bingPosition: { type: ["number", "null"] }
        aiCitations: { type: ["integer", "null"] }
        aiSessions: { type: ["integer", "null"] }
    BingPagesReport:
      type: object
      required: [rows, gscWindowStart, gscWindowEnd, bingSyncedAt, aiCitationsAt, latestUpload, totals]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BingPageMapRow"
        # The 7-day GSC window the stored gscClicks/gscImpressions/gscPosition columns cover
        # (sync pulls days -9..-3 relative to the sync run, YYYY-MM-DD).
        gscWindowStart: { type: ["string", "null"], format: date }
        gscWindowEnd: { type: ["string", "null"], format: date }
        bingSyncedAt:
          type: ["string", "null"]
          description: When the Bing API sync last ran (null = never)
        aiCitationsAt:
          type: ["string", "null"]
          description: When the AI citation rollup was last applied (null = never)
        latestUpload:
          oneOf:
            - $ref: "#/components/schemas/AiCitationUpload"
            - type: "null"
        totals:
          type: object
          required: [gscClicks, bingClicks, aiCitations, aiSessions]
          properties:
            gscClicks: { type: integer }
            bingClicks: { type: integer }
            aiCitations: { type: integer }
            aiSessions: { type: integer }
    GenerateTopicalMapInput:
      type: object
      required: [sourceContext, centralEntity, centralSearchIntent]
      properties:
        sourceContext:
          type: string
          minLength: 20
          maxLength: 4000
          description: One-paragraph charter — who the business is, what it sells, monetization bridge
        centralEntity:
          type: string
          minLength: 2
          maxLength: 200
        entitySynonyms:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        centralSearchIntent:
          type: string
          minLength: 10
          maxLength: 600
          description: One sentence with predicates (know/compare/buy…)
        bordersWill:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 300 }
        bordersWillNot:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 300 }
    TopicalMapSummary:
      type: object
      required: [id, status, phase, progressDone, progressTotal, error, sourceContext, centralEntity, entitySynonyms, centralSearchIntent, bordersWill, bordersWillNot, stats, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [queued, running, complete, failed, interrupted]
        phase: { type: ["string", "null"] }
        progressDone: { type: integer }
        progressTotal: { type: integer }
        error: { type: ["string", "null"] }
        sourceContext: { type: string }
        centralEntity: { type: string }
        entitySynonyms:
          type: array
          items: { type: string }
        centralSearchIntent: { type: string }
        bordersWill:
          type: array
          items: { type: string }
        bordersWillNot:
          type: array
          items: { type: string }
        stats:
          type: object
          additionalProperties: { type: number }
        createdAt: { type: string }
        startedAt: { type: ["string", "null"] }
        finishedAt: { type: ["string", "null"] }
        competitorScanStatus:
          type: ["string", "null"]
          description: "null | queued | running | complete | partial | failed — current state of the per-map SERP competitor scan. 'partial' means the scan ran but some topics were not covered (budget cap, timeouts, or task failures); re-run to make more progress."
        competitorScanError:
          type: ["string", "null"]
          description: Last error from the competitor scan (includes out-of-funds notice)
    TopicalMapNode:
      type: object
      required: [id, mapId, parentId, level, section, title, canonicalQuery, attributeOwned, intent, predicate, funnelStage, pageType, suggestedSlug, suggestedTitle, informationGain, borderNote, priority, status, matchedPagePath, matchSource, matchConfidence, sortOrder, pageTitle, gscClicks, gscImpressions, gscPosition]
      properties:
        id: { type: integer }
        mapId: { type: integer }
        parentId: { type: ["integer", "null"] }
        level:
          type: string
          enum: [pillar, core_topic, supporting, subtopic]
        section:
          type: string
          enum: [core, outer]
        title: { type: string }
        canonicalQuery: { type: string }
        attributeOwned: { type: string }
        intent: { type: string }
        predicate: { type: string }
        funnelStage:
          type: string
          enum: [tofu, mofu, bofu, retention]
        pageType: { type: string }
        suggestedSlug: { type: string }
        suggestedTitle: { type: string }
        informationGain: { type: ["string", "null"] }
        borderNote: { type: ["string", "null"] }
        priority:
          type: string
          enum: [high, medium, low]
        status:
          type: string
          enum: [published, gap, ignored]
        matchedPagePath: { type: ["string", "null"] }
        matchSource:
          type: ["string", "null"]
          enum: [exact_slug, top_query, embedding, null]
        matchConfidence: { type: ["number", "null"] }
        sortOrder: { type: integer }
        pageTitle:
          type: ["string", "null"]
          description: Title of the matched page (joined at read time)
        gscClicks: { type: ["integer", "null"] }
        gscImpressions: { type: ["integer", "null"] }
        gscPosition: { type: ["number", "null"] }
        competitors:
          type: array
          description: Competitor domains already ranking for this topic, from stored SERP data (latest keyword-clustering run)
          items:
            $ref: "#/components/schemas/TopicalMapNodeCompetitor"
    TopicalMapNodeCompetitor:
      type: object
      required: [domain, url, bestPosition, matchedQuery]
      properties:
        domain: { type: string }
        url: { type: string }
        bestPosition: { type: ["number", "null"] }
        matchedQuery: { type: string }
    TopicalMapBridge:
      type: object
      required: [id, sourceNodeId, targetNodeId, bridgeConcept]
      properties:
        id: { type: integer }
        sourceNodeId: { type: integer }
        targetNodeId: { type: integer }
        bridgeConcept: { type: string }
    TopicalMapPillarCoverage:
      type: object
      required: [nodeId, title, section, total, published, coveragePct]
      properties:
        nodeId: { type: integer }
        title: { type: string }
        section:
          type: string
          enum: [core, outer]
        total:
          type: integer
          description: Non-ignored nodes in this pillar's subtree (including the pillar)
        published: { type: integer }
        coveragePct: { type: number }
    TopicalMapCoverage:
      type: object
      required: [totalNodes, publishedNodes, gapNodes, ignoredNodes, coveragePct, perPillar]
      properties:
        totalNodes: { type: integer }
        publishedNodes: { type: integer }
        gapNodes: { type: integer }
        ignoredNodes: { type: integer }
        coveragePct:
          type: number
          description: published / (published + gap) × 100, ignored excluded
        perPillar:
          type: array
          items:
            $ref: "#/components/schemas/TopicalMapPillarCoverage"
    TopicalMapDetail:
      type: object
      required: [map, nodes, bridges, coverage]
      properties:
        map:
          $ref: "#/components/schemas/TopicalMapSummary"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopicalMapNode"
        bridges:
          type: array
          items:
            $ref: "#/components/schemas/TopicalMapBridge"
        coverage:
          $ref: "#/components/schemas/TopicalMapCoverage"
    UpdateTopicalMapNodeInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [gap, ignored]
