          required: false
          description: Week to roll up (YYYY-MM-DD). Defaults to the latest week.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Page-level loser rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoserPagesResponse"
  /watchlist:
    get:
      operationId: listWatchlist
      tags: [losers]
      summary: List operator watchlist queries
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistQuery"
    post:
      operationId: addWatchlistQuery
      tags: [losers]
      summary: Add a query to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistQuery"
  /watchlist/{id}:
    delete:
      operationId: deleteWatchlistQuery
      tags: [losers]
      summary: Remove a query from the watchlist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /page-keywords:
    get:
      operationId: listPageKeywords
      tags: [losers]
      summary: List operator target keywords for a page
      parameters:
        - name: url
          in: query
          required: true
          description: Page URL to list target keywords for
          schema: { type: string }
      responses:
        "200":
          description: Target keywords for the page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageTargetKeyword"
    post:
      operationId: addPageKeyword
      tags: [losers]
      summary: Add a target keyword to a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageKeywordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTargetKeyword"
  /page-keywords/{id}:
    delete:
      operationId: deletePageKeyword
      tags: [losers]
      summary: Remove a target keyword from a page
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /kb/documents:
    get:
      operationId: listKbDocuments
      tags: [kb]
      summary: List knowledge base documents used to ground briefs
      responses:
        "200":
          description: Knowledge base documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbDocument"
    post:
      operationId: addKbDocument
      tags: [kb]
      summary: Upload a knowledge base document (chunked and embedded on upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KbDocument"
  /kb/documents/{id}:
    delete:
      operationId: deleteKbDocument
      tags: [kb]
      summary: Remove a knowledge base document and its chunks
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
components:
  parameters:
    StartDate:
      in: query
      name: startDate
      required: true
      schema: { type: string, format: date }
    EndDate:
      in: query
      name: endDate
      required: true
      schema: { type: string, format: date }
    Compare:
      in: query
      name: compare
      schema: { type: boolean }
    Ga4Channel:
      in: query
      name: channel
      schema: { type: string, enum: [organic, all], default: organic }
    UrlFilter:
      in: query
      name: url
      schema: { type: string }
    RowLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 5000 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        username: { type: ["string", "null"] }
        isAdmin: { type: boolean }
    AdminSiteIntegrations:
      type: object
      required: [gsc, ga4, bing]
      properties:
        gsc: { type: boolean }
        ga4: { type: boolean }
        bing: { type: boolean }
    AdminSite:
      type: object
      required: [id, domain, host, displayName, createdAt, integrations, pagesCount]
      properties:
        id: { type: integer }
        domain: { type: string }
        host: { type: string }
        displayName: { type: string }
        createdAt: { type: string }
        integrations:
          $ref: "#/components/schemas/AdminSiteIntegrations"
        pagesCount: { type: integer }
    AdminUser:
      type: object
      required: [id, email, isAdmin, createdAt, sites]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        isAdmin: { type: boolean }
        createdAt: { type: string }
        sites:
          type: array
          items:
            $ref: "#/components/schemas/AdminSite"
    AdminOverviewTotals:
      type: object
      required: [users, sites]
      properties:
        users: { type: integer }
        sites: { type: integer }
    AdminOverview:
      type: object
      required: [totals, users, unclaimedSites]
      properties:
        totals:
          $ref: "#/components/schemas/AdminOverviewTotals"
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        unclaimedSites:
          type: array
          items:
            $ref: "#/components/schemas/AdminSite"
    Site:
      type: object
      required: [id, domain, host, displayName, sitemapUrl]
      properties:
        id: { type: integer }
        domain: { type: string }
        host: { type: string }
        displayName: { type: string }
        sitemapUrl: { type: ["string", "null"] }
    SitesResponse:
      type: object
      required: [sites, legacyClaimable]
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        legacyClaimable: { type: boolean }
    SiteLimits:
      type: object
      required: [maxCrawlPages, maxLlmCallsPerRun, maxSerpQueriesPerRun]
      properties:
        maxCrawlPages: { type: integer }
        maxLlmCallsPerRun: { type: integer }
        maxSerpQueriesPerRun: { type: integer }
    SiteLimitBounds:
      type: object
      required: [min, max, default]
      properties:
        min: { type: integer }
        max: { type: integer }
        default: { type: integer }
    SiteLimitsResponse:
      type: object
      required: [limits, bounds]
      properties:
        limits:
          $ref: "#/components/schemas/SiteLimits"
        bounds:
          type: object
          required: [maxCrawlPages, maxLlmCallsPerRun, maxSerpQueriesPerRun]
          properties:
            maxCrawlPages:
              $ref: "#/components/schemas/SiteLimitBounds"
            maxLlmCallsPerRun:
              $ref: "#/components/schemas/SiteLimitBounds"
            maxSerpQueriesPerRun:
              $ref: "#/components/schemas/SiteLimitBounds"
    UpdateSiteInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
    UpdateSiteLimitsInput:
      type: object
      properties:
        maxCrawlPages: { type: integer, minimum: 50, maximum: 20000 }
        maxLlmCallsPerRun: { type: integer, minimum: 10, maximum: 5000 }
        maxSerpQueriesPerRun: { type: integer, minimum: 5, maximum: 2000 }
    ClaimRateLimited:
      type: object
      required: [error, retryAfterSeconds]
      properties:
        error: { type: string }
        retryAfterSeconds: { type: integer, minimum: 1 }
    ClaimLegacyInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 200 }
    CreateSiteInput:
      type: object
      required: [domain]
      properties:
        domain: { type: string, minLength: 3, maxLength: 300 }
        displayName: { type: string, maxLength: 120 }
        sitemapUrl: { type: string, maxLength: 500 }
    SetGscPropertyInput:
      type: object
      required: [property]
      properties:
        property: { type: string, minLength: 1, maxLength: 500 }
    ConnectGa4Input:
      type: object
      required: [serviceAccountJson, propertyId]
      properties:
        serviceAccountJson: { type: string, minLength: 1, maxLength: 20000 }
        propertyId: { type: string, minLength: 1, maxLength: 50 }
    ConnectBingInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 200 }
    IntegrationsStatus:
      type: object
      required: [gsc, ga4, bing, wp]
      properties:
        gsc:
          type: object
          required: [connected, property, needsProperty]
          properties:
            connected: { type: boolean }
            property: { type: ["string", "null"] }
            needsProperty: { type: boolean }
        ga4:
          type: object
          required: [connected, propertyId]
          properties:
            connected: { type: boolean }
            propertyId: { type: ["string", "null"] }
        bing:
          type: object
          required: [connected]
          properties:
            connected: { type: boolean }
        wp:
          type: object
          required: [connected, baseUrl, username]
          properties:
            connected: { type: boolean }
            baseUrl: { type: ["string", "null"] }
            username: { type: ["string", "null"] }
    ConnectWpInput:
      type: object
      required: [baseUrl, username, appPassword]
      properties:
        # The WordPress site root, e.g. https://example.com
        baseUrl: { type: string }
        username: { type: string }
        # A WordPress Application Password (Users → Profile → Application Passwords).
        appPassword: { type: string }
    CmsPublishInput:
      type: object
      required: [title, markdown, status]
      properties:
        title: { type: string, minLength: 1 }
        # Post body as Markdown; converted to HTML before publishing.
        markdown: { type: string, minLength: 1 }
        status:
          type: string
          enum: [draft, publish]
        slug: { type: ["string", "null"] }
        excerpt: { type: ["string", "null"] }
    CmsPublishResult:
      type: object
      required: [postId, link, status, editLink]
      properties:
        postId: { type: integer }
        # Public permalink of the created post.
        link: { type: string }
        status: { type: string }
        # Direct wp-admin edit URL for the post.
        editLink: { type: string }
    BacklinkProspect:
      type: object
      required: [id, domain, rank, backlinks, competitorsLinking, status, notes, createdAt]
      properties:
        id: { type: integer }
        domain: { type: string }
        # DataForSEO domain rank (0-1000), null when unknown.
        rank: { type: ["integer", "null"] }
        backlinks: { type: integer }
        competitorsLinking:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [new, contacted, replied, linked, rejected]
        notes: { type: string }
        createdAt: { type: string, format: date-time }
    BacklinkProspectList:
      type: object
      required: [prospects]
      properties:
        prospects:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkProspect"
    ProspectDiscoveryInput:
      type: object
      required: [competitors]
      properties:
        # 1-5 competitor domains, e.g. ["competitor.com"].
        competitors:
          type: array
          items: { type: string, minLength: 3 }
          minItems: 1
          maxItems: 5
    RunBacklinkAuditInput:
      type: object
      properties:
        competitors:
          type: array
          items: { type: string, minLength: 3 }
          maxItems: 5
        refresh: { type: boolean }
    BacklinkSummary:
      type: object
      required:
        - target
        - backlinks
        - referringDomains
        - referringMainDomains
        - brokenBacklinks
        - referringIps
        - dofollow
        - nofollow
      properties:
        target: { type: string }
        rank: { type: ["integer", "null"] }
        backlinks: { type: integer }
        referringDomains: { type: integer }
        referringMainDomains: { type: integer }
        brokenBacklinks: { type: integer }
        referringIps: { type: integer }
        dofollow: { type: integer }
        nofollow: { type: integer }
        firstSeen: { type: ["string", "null"] }
    BacklinkDisavowDecision:
      type: object
      required: [domain, decision, updatedAt]
      properties:
        domain: { type: string }
        decision: { type: string, enum: [disavow, keep] }
        updatedAt: { type: string, format: date-time }
    BacklinkDisavowList:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkDisavowDecision"
    SetDisavowDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [disavow, keep] }
    BacklinkAnchor:
      type: object
      required: [anchor, backlinks, referringDomains, dofollow, nofollow]
      properties:
        anchor: { type: string }
        backlinks: { type: integer }
        referringDomains: { type: integer }
        dofollow: { type: integer }
        nofollow: { type: integer }
    TopBacklink:
      type: object
      required: [urlFrom, urlTo, domainFrom, dofollow]
      properties:
        urlFrom: { type: string }
        urlTo: { type: string }
        domainFrom: { type: string }
        pageFromTitle: { type: ["string", "null"] }
        anchor: { type: ["string", "null"] }
        dofollow: { type: boolean }
        rank: { type: ["integer", "null"] }
        domainFromRank: { type: ["integer", "null"] }
        firstSeen: { type: ["string", "null"] }
        lastSeen: { type: ["string", "null"] }
    AuditReferringDomain:
      type: object
      required: [domain, backlinks]
      properties:
        domain: { type: string }
        backlinks: { type: integer }
        rank: { type: ["integer", "null"] }
        firstSeen: { type: ["string", "null"] }
        lastSeen: { type: ["string", "null"] }
    BacklinkAudit:
      type: object
      required: [fetchedAt, target, anchors, topBacklinks, referringDomains, competitors]
      properties:
        fetchedAt: { type: string, format: date-time }
        target: { type: string }
        summary:
          oneOf:
            - $ref: "#/components/schemas/BacklinkSummary"
            - type: "null"
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkAnchor"
        topBacklinks:
          type: array
          items:
            $ref: "#/components/schemas/TopBacklink"
        referringDomains:
          type: array
          items:
            $ref: "#/components/schemas/AuditReferringDomain"
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkSummary"
    BacklinkAuditResponse:
      type: object
      required: [audit]
      properties:
        audit:
          oneOf:
            - $ref: "#/components/schemas/BacklinkAudit"
            - type: "null"
    BacklinkHistoryPoint:
      type: object
      required: [date]
      properties:
        date: { type: string, description: "YYYY-MM-DD" }
        rank: { type: integer, nullable: true }
