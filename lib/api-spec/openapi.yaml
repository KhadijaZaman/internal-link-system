          description: Set when CTR is far below the position norm on meaningful volume
        missedClicks:
          type: integer
          description: Estimated clicks lost vs the position benchmark over the selected range (0 when not flagged)
        competingUrls:
          type: ["array", "null"]
          items: { type: string }
          description: Pages splitting rankings on this query (from the latest weekly snapshot); null when not cannibalized
